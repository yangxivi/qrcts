name: Supabase Keep-Alive

# 防止 Supabase 免费层项目因连续 7 天不活跃被自动暂停（暂停期间前端读不到数据→仪表盘全空）。
# 每 5 天用 anon key 发起一次真实查询，制造活跃连接，远小于 7 天阈值。
on:
  schedule:
    - cron: '23 4 */5 * *'        # 每 5 天 UTC 04:23 触发（与 yingfubao 的 03:17 错开）
  workflow_dispatch:              # 也可手动点一下立即跑

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to stay active
        run: |
          URL="${{ secrets.SUPABASE_URL }}/rest/v1/products?select=id&limit=1"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "$URL" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase ping HTTP status: $HTTP"
          if [ "$HTTP" = "200" ]; then
            echo "keep-alive OK, project stays active"
          else
            echo "keep-alive FAILED, HTTP=$HTTP - check Secrets or project status"
            exit 1
          fi
