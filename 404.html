<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/qrcts/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>二维码溯源系统</title>
    <script>
      (function(){
        var base = '/qrcts';
        var pathname = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        if (pathname.indexOf(base) === 0) {
          var newPath = pathname.slice(base.length) || '/';
          window.history.replaceState(null, '', newPath + search + hash);
        }
        var origPush = history.pushState;
        var origReplace = history.replaceState;
        history.pushState = function(s, t, url) {
          if (typeof url === 'string' && url.charAt(0) === '/') {
            url = base + (url === '/' ? '' : url);
          }
          return origPush.call(this, s, t, url);
        };
        history.replaceState = function(s, t, url) {
          if (typeof url === 'string' && url.charAt(0) === '/') {
            url = base + (url === '/' ? '' : url);
          }
          return origReplace.call(this, s, t, url);
        };
      })();
    </script>
    <script src="/qrcts/env-config.js"></script>
    <script type="module" crossorigin src="/qrcts/assets/index-muZMgV9K.js"></script>
    <link rel="stylesheet" crossorigin href="/qrcts/assets/index-CMqRsil8.css">
  </head>

    <div id="root"></div>
  </body>
</html>
