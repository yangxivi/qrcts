<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/qrcts/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>二维码溯源系统</title>
    <script src="/qrcts/env-config.js?v=20260731"></script>
    <!-- 修复 GitHub Pages 项目子路径 -->
    <script>
      (function() {
        var BASE = '/qrcts';
        var origOrigin = window.location.origin;
        if (location.pathname.indexOf(BASE) === 0) {
          try {
            Object.defineProperty(window.location, 'origin', {
              get: function() { return origOrigin + BASE; },
              configurable: true
            });
          } catch(e) {}
        }
      })();
    </script>
    <!-- 响应式布局适配 -->
    <style>
      html { font-size: 16px; -webkit-text-size-adjust: 100%; }
      body { overflow-x: hidden; }

      /* ===== 侧边栏：小屏抽屉 ===== */
      @media (max-width: 767px) {
        .flex.h-screen > aside.w-60 {
          position: fixed !important;
          left: -260px !important;
          top: 0 !important;
          bottom: 0 !important;
          z-index: 9999 !important;
          transition: left 0.3s ease !important;
          width: 240px !important;
        }
        .flex.h-screen > aside.w-60.sidebar-open {
          left: 0 !important;
          box-shadow: 4px 0 20px rgba(0,0,0,0.3);
        }
        .flex.h-screen > main,
        .flex.h-screen > div:not(aside) {
          width: 100% !important;
        }
        /* 只有有侧边栏的页面才给 main 留汉堡按钮空间 */
        .flex.h-screen > main {
          padding-left: 52px !important;
        }
      }

      /* ===== 汉堡按钮（JS 动态控制显示） ===== */
      .mobile-menu-btn {
        display: none;
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10000;
        width: 40px;
        height: 40px;
        background: #1e293b;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }
      .mobile-menu-btn span {
        display: block;
        width: 22px;
        height: 2px;
        background: #fff;
        border-radius: 2px;
        transition: all 0.3s ease;
      }
      .mobile-menu-btn.active span:nth-child(1) {
        transform: rotate(45deg) translate(5px, 5px);
      }
      .mobile-menu-btn.active span:nth-child(2) { opacity: 0; }
      .mobile-menu-btn.active span:nth-child(3) {
        transform: rotate(-45deg) translate(5px, -5px);
      }
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 9998;
      }
      .sidebar-overlay.active { display: block; }

      /* ===== 表格横向滚动 ===== */
      .card.overflow-hidden {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
      }
      .overflow-x-auto > table.table { min-width: 480px; width: 100%; }
      .card.overflow-hidden > table.table { min-width: 600px; width: 100%; }
      @media (max-width: 767px) {
        .card.overflow-hidden {
          margin: 0 -12px;
          padding: 0 12px;
          border-left: none;
          border-right: none;
          border-radius: 0;
        }
        .card.overflow-hidden > table.table { min-width: 500px; }
        .card.overflow-hidden th,
        .card.overflow-hidden td {
          padding: 8px 10px !important;
          font-size: 13px !important;
        }
        .card.overflow-hidden th {
          white-space: nowrap;
          font-size: 12px !important;
        }
      }

      /* ===== 卡片间距 ===== */
      @media (max-width: 767px) {
        .card { padding: 14px !important; border-radius: 10px !important; }
        .p-6 { padding: 14px !important; }
        .p-5 { padding: 12px !important; }
        .p-4 { padding: 10px !important; }
        .overflow-y-auto.p-6 { padding: 12px !important; }
        .overflow-auto.bg-gray-200.p-6 { padding: 10px !important; }
        h1.text-2xl, h2.text-2xl { font-size: 1.25rem !important; }
        h1.text-xl, h2.text-xl { font-size: 1.15rem !important; }
        button { min-height: 38px; }
      }

      /* ===== 产品基本信息卡片：全平台每项一行 =====
         真实 DOM 类名: grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4
         5 个子元素: SN码 / 产品名称 / 产品型号 / 生产日期 / 检验状态 */
      .grid.grid-cols-2[class*="sm:grid-cols-3"][class*="lg:grid-cols-5"] {
        grid-template-columns: 1fr !important;
        gap: 6px 0 !important;
      }
      .grid.grid-cols-2[class*="sm:grid-cols-3"][class*="lg:grid-cols-5"] > div {
        padding: 5px 0 !important;
        border-bottom: 1px solid #f1f5f9;
      }
      .grid.grid-cols-2[class*="sm:grid-cols-3"][class*="lg:grid-cols-5"] > div:last-child {
        border-bottom: none !important;
      }
      .grid.grid-cols-2[class*="sm:grid-cols-3"][class*="lg:grid-cols-5"] > div:first-child .font-mono {
        font-size: 14px !important;
        line-height: 1.6;
        word-break: break-all;
      }

      /* ===== 原材料录入页产品信息卡: 移动端单列 =====
         真实 DOM 类名: grid grid-cols-3 gap-4 text-sm */
      @media (max-width: 639px) {
        .grid.grid-cols-3.gap-4.text-sm {
          grid-template-columns: 1fr !important;
          gap: 6px !important;
          font-size: 13px !important;
        }
        .grid.grid-cols-3.gap-4.text-sm .font-mono {
          font-size: 12px !important;
          word-break: break-all;
          line-height: 1.5;
        }
        .grid.grid-cols-3.gap-4.text-sm p[class*="text-gray"] {
          font-size: 11px !important;
        }
        [class*="grid-cols-4"]:not([class*="lg:grid-cols-5"]) {
          grid-template-columns: 1fr 1fr !important;
          gap: 8px !important;
        }
        [class*="grid-cols-6"]:not([class*="lg:grid-cols-5"]) {
          grid-template-columns: 1fr 1fr 1fr !important;
          gap: 8px !important;
        }
        /* 物料录入表单 (grid-cols-12) */
        .grid.grid-cols-12 {
          grid-template-columns: 1fr 1fr !important;
          gap: 10px 8px !important;
        }
        .grid.grid-cols-12 > div { min-width: 0 !important; }
        .grid.grid-cols-12 .col-span-4,
        .grid.grid-cols-12 .col-span-3,
        .grid.grid-cols-12 .col-span-2 {
          grid-column: span 1 !important;
        }
        .grid.grid-cols-12 > div:last-child {
          display: flex;
          justify-content: flex-end;
          padding-top: 4px;
        }
      }
      @media (max-width: 479px) {
        .grid.grid-cols-12 { grid-template-columns: 1fr !important; }
      }

      /* ===== SN 码显示 ===== */
      .font-mono.text-sm.font-medium.mt-1.break-all {
        word-break: break-all;
        font-size: 12px !important;
        line-height: 1.5;
      }
      @media (max-width: 767px) {
        .font-mono { font-size: 12px !important; word-break: break-all; }
      }

      /* ===== 表单输入框 ===== */
      @media (max-width: 767px) {
        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
          font-size: 16px !important;
          min-height: 42px;
        }
        [class*="modal"],
        [role="dialog"] {
          max-width: calc(100vw - 24px) !important;
          margin: 8px !important;
          max-height: calc(100vh - 48px) !important;
          overflow-y: auto;
        }
      }

      /* ===== 按钮组 ===== */
      @media (max-width: 480px) {
        .flex.items-center.gap-3,
        .flex.items-center.gap-2 { flex-wrap: wrap; }
        .justify-between.flex-wrap { flex-wrap: wrap; }
      }

      /* ===== 物料录入表格 ===== */
      @media (max-width: 639px) {
        .card input[type="text"],
        .card input[type="number"] {
          min-height: 36px;
          font-size: 14px !important;
          padding: 6px 8px !important;
        }
      }

      /* ===== 登录页 ===== */
      @media (max-width: 480px) {
        .min-h-screen.flex.items-center.justify-center { padding: 16px !important; }
        .w-full.max-w-md { max-width: 100% !important; }
      }

      /* ===== 二维码展示页面 ===== */
      @media (max-width: 767px) {
        .flex-1.overflow-auto.bg-gray-200 { padding: 8px !important; }
        .bg-white.shadow-lg[style*="width"] {
          max-width: 100% !important;
          height: auto !important;
        }
      }

      /* ===== 平板端 ===== */
      @media (min-width: 768px) and (max-width: 1023px) {
        .card { padding: 16px !important; }
        .p-6 { padding: 18px !important; }
      }
    </style>
    <script type="module" crossorigin src="/qrcts/assets/index-muZMgV9K.js"></script>
    <link rel="stylesheet" crossorigin href="/qrcts/assets/index-CMqRsil8.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        /* ===== 汉堡按钮 + 侧边栏 ===== */
        var btn = document.createElement('button');
        btn.className = 'mobile-menu-btn';
        btn.innerHTML = '<span></span><span></span><span></span>';
        btn.setAttribute('aria-label', '打开菜单');
        document.body.appendChild(btn);

        var overlay = document.createElement('div');
        overlay.className = 'sidebar-overlay';
        document.body.appendChild(overlay);

        function toggleSidebar(e) {
          e && e.stopPropagation();
          var aside = document.querySelector('aside.w-60');
          if (!aside) return;
          var isOpen = aside.classList.toggle('sidebar-open');
          btn.classList.toggle('active', isOpen);
          overlay.classList.toggle('active', isOpen);
          btn.setAttribute('aria-label', isOpen ? '关闭菜单' : '打开菜单');
          document.body.style.overflow = isOpen ? 'hidden' : '';
        }
        btn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            var aside = document.querySelector('aside.w-60.sidebar-open');
            if (aside) toggleSidebar();
          }
        });

        /* ===== 产品信息卡 inline style 双保险 =====
           CSS 选择器已能匹配，但 React 重新渲染时可能覆盖 class，
           这里用 inline style 确保万无一失 */
        function forceProductGridSingleCol() {
          /* 产品基本信息卡: grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 */
          var grids = document.querySelectorAll('.grid.grid-cols-2');
          for (var i = 0; i < grids.length; i++) {
            var el = grids[i];
            var cls = el.className || '';
            if (cls.indexOf('lg:grid-cols-5') !== -1 && cls.indexOf('sm:grid-cols-3') !== -1) {
              if (el.style.getPropertyValue('grid-template-columns') !== '1fr') {
                el.style.setProperty('grid-template-columns', '1fr', 'important');
                el.style.setProperty('gap', '6px 0', 'important');
              }
              var kids = el.children;
              for (var k = 0; k < kids.length; k++) {
                kids[k].style.setProperty('padding', '5px 0', 'important');
                kids[k].style.setProperty('border-bottom', k < kids.length - 1 ? '1px solid #f1f5f9' : 'none', 'important');
              }
            }
          }
        }

        /* ===== 路由变化时：关闭侧边栏 + 重新强制单列 ===== */
        var origPushState = history.pushState;
        history.pushState = function() {
          origPushState.apply(this, arguments);
          var aside = document.querySelector('aside.w-60.sidebar-open');
          if (aside) toggleSidebar();
          setTimeout(forceProductGridSingleCol, 100);
          setTimeout(forceProductGridSingleCol, 500);
        };
        var origReplaceState = history.replaceState;
        history.replaceState = function() {
          origReplaceState.apply(this, arguments);
          setTimeout(forceProductGridSingleCol, 100);
        };
        window.addEventListener('popstate', function() {
          setTimeout(forceProductGridSingleCol, 100);
        });

        /* ===== MutationObserver: 动态检测侧边栏 + 产品信息卡 ===== */
        var observer = new MutationObserver(function() {
          /* 只有有侧边栏的页面才显示汉堡按钮（移动端） */
          var aside = document.querySelector('aside.w-60');
          if (window.innerWidth <= 767) {
            btn.style.display = aside ? 'flex' : 'none';
          } else {
            btn.style.display = 'none';
          }
          /* 如果侧边栏不存在但按钮是 active 状态，重置 */
          if (!aside && btn.classList.contains('active')) {
            btn.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
          }
          /* 强制产品信息卡单列 */
          forceProductGridSingleCol();
        });
        observer.observe(document.body, { childList: true, subtree: true });

        /* 初始执行 */
        forceProductGridSingleCol();
        setTimeout(forceProductGridSingleCol, 200);
        setTimeout(forceProductGridSingleCol, 800);
        setTimeout(forceProductGridSingleCol, 2000);
        setTimeout(forceProductGridSingleCol, 4000);

        /* 窗口大小变化时重新检测 */
        window.addEventListener('resize', function() {
          var aside = document.querySelector('aside.w-60');
          if (window.innerWidth <= 767) {
            btn.style.display = aside ? 'flex' : 'none';
          } else {
            btn.style.display = 'none';
          }
          forceProductGridSingleCol();
        });
      })();
    </script>
  </body>
</html>
