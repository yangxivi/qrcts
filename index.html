<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/qrcts/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>二维码溯源系统</title>
    <script src="/qrcts/env-config.js?v=20260730"></script>
    <!-- 修复 GitHub Pages 项目子路径：window.location.origin 不含 /qrcts 前缀，
         导致二维码链接和"查看"链接指向错误路径（404）。
         在主 JS 加载前拦截 origin，自动补全子路径。 -->
    <script>
      (function() {
        var BASE = '/qrcts';
        var origOrigin = window.location.origin;
        // 仅在 GitHub Pages 项目子路径部署时补全（本地开发不干预）
        if (location.pathname.indexOf(BASE) === 0) {
          try {
            Object.defineProperty(window.location, 'origin', {
              get: function() { return origOrigin + BASE; },
              configurable: true
            });
          } catch(e) {}
        }
      })();
    </script>
    <!-- 响应式布局适配：手机/平板/桌面端自适应 -->
    <style>
      /* ============================================
         全局响应式基础
         ============================================ */
      html { font-size: 16px; -webkit-text-size-adjust: 100%; }
      body { overflow-x: hidden; }

      /* ============================================
         侧边栏：小屏隐藏 + 汉堡菜单 + 遮罩层
         ============================================ */
      /* 侧边栏默认在移动端隐藏 */
      @media (max-width: 767px) {
        .flex.h-screen > aside.w-60 {
          position: fixed !important;
          left: -260px !important;
          top: 0 !important;
          bottom: 0 !important;
          z-index: 9999 !important;
          transition: left 0.3s ease !important;
          width: 240px !important;
        }
        .flex.h-screen > aside.w-60.sidebar-open {
          left: 0 !important;
          box-shadow: 4px 0 20px rgba(0,0,0,0.3);
        }
        /* 主内容区占满宽度 */
        .flex.h-screen > main,
        .flex.h-screen > div:not(aside) {
          width: 100% !important;
        }
      }

      /* 汉堡按钮 - 由 JS 动态注入 */
      .mobile-menu-btn {
        display: none;
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10000;
        width: 40px;
        height: 40px;
        background: #1e293b;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }
      .mobile-menu-btn span {
        display: block;
        width: 22px;
        height: 2px;
        background: #fff;
        border-radius: 2px;
        transition: all 0.3s ease;
      }
      .mobile-menu-btn.active span:nth-child(1) {
        transform: rotate(45deg) translate(5px, 5px);
      }
      .mobile-menu-btn.active span:nth-child(2) {
        opacity: 0;
      }
      .mobile-menu-btn.active span:nth-child(3) {
        transform: rotate(-45deg) translate(5px, -5px);
      }

      @media (max-width: 767px) {
        .mobile-menu-btn { display: flex; }
      }

      /* 遮罩层 */
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 9998;
      }
      .sidebar-overlay.active { display: block; }

      /* ============================================
         表格：小屏横向滚动 + 列宽优化
         ============================================ */
      .card.overflow-hidden {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
      }
      /* 原材料展示页的表格（使用 overflow-x-auto 包裹） */
      .overflow-x-auto > table.table {
        min-width: 480px;
        width: 100%;
      }
      .card.overflow-hidden > table.table {
        min-width: 600px;   /* 保证表格最小可读宽度 */
        width: 100%;
      }
      @media (max-width: 767px) {
        .card.overflow-hidden {
          border-radius: 10px;
          margin: 0 -12px;
          padding: 0 12px;
          border-left: none;
          border-right: none;
          border-radius: 0;
        }
        .card.overflow-hidden > table.table {
          min-width: 500px;
        }
        /* 表格单元格内边距缩小 */
        .card.overflow-hidden th,
        .card.overflow-hidden td {
          padding: 8px 10px !important;
          font-size: 13px !important;
        }
        .card.overflow-hidden th {
          white-space: nowrap;
          font-size: 12px !important;
        }
      }

      /* ============================================
         卡片 & 容器：移动端间距优化
         ============================================ */
      @media (max-width: 767px) {
        /* 卡片内边距 */
        .card { padding: 14px !important; border-radius: 10px !important; }
        .p-6 { padding: 14px !important; }
        .p-5 { padding: 12px !important; }
        .p-4 { padding: 10px !important; }

        /* 主内容区内边距 */
        .overflow-y-auto.p-6 { padding: 12px !important; }
        .overflow-auto.bg-gray-200.p-6 { padding: 10px !important; }

        /* 页面标题区域 */
        h1.text-2xl, h2.text-2xl { font-size: 1.25rem !important; }
        h1.text-xl, h2.text-xl { font-size: 1.15rem !important; }

        /* 按钮尺寸微调 */
        button { min-height: 38px; }
      }

      /* ============================================
         产品基本信息卡片：全平台每项一行
         SN码 / 产品名称 / 产品型号 / 生产日期 / 检验状态 各占独立一行
         ============================================ */
      /* 识别产品基本信息卡：grid-cols-2 + lg:grid-cols-5 组合 → 全平台单列 */
      .grid.grid-cols-2[class*="lg:grid-cols-5"],
      [class*="grid-cols-2"][class*="lg:grid-cols-5"] {
        grid-template-columns: 1fr !important;
        gap: 8px 0 !important;
      }
      /* 每个子元素（SN码/名称/型号/日期/状态）各占一行，标签+值垂直排列清晰 */
      .grid.grid-cols-2[class*="lg:grid-cols-5"] > div,
      [class*="grid-cols-2"][class*="lg:grid-cols-5"] > div {
        padding: 4px 0 !important;
        border-bottom: 1px solid #f1f5f9;
      }
      .grid.grid-cols-2[class*="lg:grid-cols-5"] > div:last-child,
      [class*="grid-cols-2"][class*="lg:grid-cols-5"] > div:last-child {
        border-bottom: none !important;
      }
      /* SN 码文字：等宽字体 + 长码换行 */
      .grid.grid-cols-2[class*="lg:grid-cols-5"] > div:first-child .font-mono,
      [class*="grid-cols-2"][class*="lg:grid-cols-5"] > div:first-child .font-mono {
        font-size: 14px !important;
        line-height: 1.7;
        word-break: break-all;
      }

      @media (max-width: 639px) {
        /* 原材料录入页产品信息卡（grid-cols-3: SN码/名称/型号）→ 移动端单列堆叠 */
        .grid.grid-cols-3:not([class*="lg:grid-cols-5"]):not([class*="sm:"]):not([class*="md:"]),
        [class*="grid-cols-3"]:not([class*="lg:grid-cols-5"]) {
          grid-template-columns: 1fr !important;
          gap: 6px !important;
        }
        /* 该卡片内文字缩小 */
        .grid.grid-cols-3:not([class*="lg:grid-cols-5"]) {
          font-size: 13px !important;
        }
        .grid.grid-cols-3:not([class*="lg:grid-cols-5"]) .font-mono {
          font-size: 12px !important;
          word-break: break-all;
          line-height: 1.5;
        }
        .grid.grid-cols-3:not([class*="lg:grid-cols-5"]) p[class*="text-gray"] {
          font-size: 11px !important;
        }
        [class*="grid-cols-4"]:not([class*="lg:grid-cols-5"]) {
          grid-template-columns: 1fr 1fr !important;
          gap: 8px !important;
        }
        [class*="grid-cols-6"]:not([class*="lg:grid-cols-5"]) {
          grid-template-columns: 1fr 1fr 1fr !important;
          gap: 8px !important;
        }

        /* 物料录入表单 (grid-cols-12: 4+3+3+2) → 纵向堆叠 */
        .grid.grid-cols-12 {
          grid-template-columns: 1fr 1fr !important;
          gap: 10px 8px !important;
        }
        .grid.grid-cols-12 > div {
          min-width: 0 !important;
        }
        .grid.grid-cols-12 .col-span-4,
        .grid.grid-cols-12 .col-span-3,
        .grid.grid-cols-12 .col-span-2 {
          grid-column: span 1 !important;
        }
        /* 删除按钮单独一行靠右 */
        .grid.grid-cols-12 > div:last-child {
          display: flex;
          justify-content: flex-end;
          padding-top: 4px;
        }
      }

      @media (max-width: 479px) {
        /* 超小屏：物料录入每行只放一个字段 */
        .grid.grid-cols-12 {
          grid-template-columns: 1fr !important;
        }
      }

      /* ============================================
         SN 码显示：长码换行不溢出
         ============================================ */
      .font-mono.text-sm.font-medium.mt-1.break-all {
        word-break: break-all;
        font-size: 12px !important;
        line-height: 1.5;
      }
      @media (max-width: 767px) {
        .font-mono { font-size: 11px !important; word-break: break-all; }
      }

      /* ============================================
         表单输入框：移动端全宽
         ============================================ */
      @media (max-width: 767px) {
        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
          font-size: 16px !important;  /* iOS 防止自动缩放 */
          min-height: 42px;
        }
        /* 弹窗/模态框 */
        [class*="modal"],
        [role="dialog"] {
          max-width: calc(100vw - 24px) !important;
          margin: 8px !important;
          max-height: calc(100vh - 48px) !important;
          overflow-y: auto;
        }
      }

      /* ============================================
         操作按钮组：移动端可换行
         ============================================ */
      @media (max-width: 480px) {
        .flex.items-center.gap-3,
        .flex.items-center.gap-2 {
          flex-wrap: wrap;
        }
        /* 头部操作栏 */
        .justify-between.flex-wrap { flex-wrap: wrap; }
      }

      /* ============================================
         物料录入表格特殊处理
         ============================================ */
      @media (max-width: 639px) {
        /* 物料表格的输入框不要太大 */
        .card input[type="text"],
        .card input[type="number"] {
          min-height: 36px;
          font-size: 14px !important;
          padding: 6px 8px !important;
        }
      }

      /* ============================================
         登录页：移动端居中优化
         ============================================ */
      @media (max-width: 480px) {
        .min-h-screen.flex.items-center.justify-center {
          padding: 16px !important;
        }
        .w-full.max-w-md {
          max-width: 100% !important;
        }
      }

      /* ============================================
         二维码展示页面
         ============================================ */
      @media (max-width: 767px) {
        .flex-1.overflow-auto.bg-gray-200 {
          padding: 8px !important;
        }
        .bg-white.shadow-lg[style*="width"] {
          max-width: 100% !important;
          height: auto !important;
        }
      }

      /* ============================================
         顶部导航条（返回按钮等）
         ============================================ */
      @media (max-width: 767px) {
        /* 给汉堡按钮留出空间 */
        .flex.h-screen > *:not(aside) {
          padding-left: 56px !important;  /* 为汉堡按钮留空间 */
        }
        .flex.h-screen {
          padding-top: 0 !important;
        }
      }

      /* ============================================
         通用工具类补充
         ============================================ */
      .responsive-hide-mobile { display: block; }
      .responsive-show-mobile { display: none; }
      @media (max-width: 767px) {
        .responsive-hide-mobile { display: none !important; }
        .responsive-show-mobile { display: block !important; }
      }

      /* 文字截断辅助 */
      .text-truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 平板端微调 (768px - 1024px) */
      @media (min-width: 768px) and (max-width: 1023px) {
        .card { padding: 16px !important; }
        .p-6 { padding: 18px !important; }
      }
    </style>
    <script type="module" crossorigin src="/qrcts/assets/index-muZMgV9K.js"></script>
    <link rel="stylesheet" crossorigin href="/qrcts/assets/index-CMqRsil8.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- 移动端侧边栏控制脚本 -->
    <script>
      (function() {
        var btn = document.createElement('button');
        btn.className = 'mobile-menu-btn';
        btn.id = 'mobile-menu-toggle';
        btn.innerHTML = '<span></span><span></span><span></span>';
        btn.setAttribute('aria-label', '打开菜单');
        document.body.appendChild(btn);

        var overlay = document.createElement('div');
        overlay.className = 'sidebar-overlay';
        overlay.id = 'sidebar-overlay';
        document.body.appendChild(overlay);

        function toggleSidebar(e) {
          e && e.stopPropagation();
          var aside = document.querySelector('aside.w-60');
          if (!aside) return;
          var isOpen = aside.classList.toggle('sidebar-open');
          btn.classList.toggle('active', isOpen);
          overlay.classList.toggle('active', isOpen);
          btn.setAttribute('aria-label', isOpen ? '关闭菜单' : '打开菜单');
          // 阻止背景滚动
          document.body.style.overflow = isOpen ? 'hidden' : '';
        }

        btn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // ESC 关闭
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            var aside = document.querySelector('aside.w-60.sidebar-open');
            if (aside) toggleSidebar();
          }
        });

        // 路由变化时自动关闭侧边栏
        var pushState = history.pushState;
        history.pushState = function() {
          pushState.apply(this, arguments);
          var aside = document.querySelector('aside.w-60.sidebar-open');
          if (aside) toggleSidebar();
        };
      })();
    </script>
  </body>
</html>
