            if (url.indexOf('?') === -1) url += '?__qrchk=' + Date.now();
            else url += '&__qrchk=' + Date.now();
            fetch(url, { cache: 'no-store' }).then(function(r) { return r.text(); }).then(function(h) {
              var m = h.match(/data-v="([^"]+)"/);
              if (m && m[1] !== V) {
                try { if ('caches' in window) { caches.keys().then(function(ks) { ks.forEach(function(kk) { caches.delete(kk); }); }); } } catch (e) {}

          localStorage.setItem(k, V);
          if (old && old !== V) {
            try { if ('caches' in window) { caches.keys().then(function(ks) { ks.forEach(function(kk) { caches.delete(kk); }); }); } } catch (e) {}
            location.reload();

          if (document.documentElement.getAttribute('data-v') !== V) { location.reload(); return; }
          /* 打开瞬间兜底拉一次最新 HTML */

    <div id="root"></div>
    <script>
      (function() {
        /* ===== 汉堡按钮 + 侧边栏 ===== */
        var btn = document.createElement('button');
        btn.className = 'mobile-menu-btn';
        btn.innerHTML = '<span></span><span></span><span></span>';
        btn.setAttribute('aria-label', '打开菜单');
        document.body.appendChild(btn);

        var overlay = document.createElement('div');
        overlay.className = 'sidebar-overlay';
        document.body.appendChild(overlay);

        function toggleSidebar(e) {
          e && e.stopPropagation();
          var aside = document.querySelector('aside.w-60');
          if (!aside) return;
          var isOpen = aside.classList.toggle('sidebar-open');
          btn.classList.toggle('active', isOpen);
          overlay.classList.toggle('active', isOpen);
          btn.setAttribute('aria-label', isOpen ? '关闭菜单' : '打开菜单');
          document.body.style.overflow = isOpen ? 'hidden' : '';
        }
        btn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            var aside = document.querySelector('aside.w-60.sidebar-open');
            if (aside) toggleSidebar();
          }
        });

        /* ===== 核心：强制产品信息卡每项一行（仅限扫码页 /t/，后台页面绝不动） =====
           不依赖 CSS 选择器，直接通过"SN 码"文字内容定位 grid 容器，
           然后把 display:grid 改成 display:block，每个子元素自然占一行。
           同时覆盖原材料录入页的 grid-cols-3 产品信息卡。
           教训：此前全页面运行误伤后台概览/二维码页布局，必须限定 /t/ 路由。 */
        function forceSingleCol() {
          if (location.pathname.indexOf('/t/') !== 0) return;
          /* 策略1：通过"SN 码"/"SN码"文字标签定位 */
          var allP = document.querySelectorAll('p, span, small, div');
          for (var i = 0; i < allP.length; i++) {
            var t = (allP[i].textContent || '').trim();
            if (t === 'SN 码' || t === 'SN码' || t === 'SN') {
              var node = allP[i];
              for (var up = 0; up < 4; up++) {
                node = node.parentElement;
                if (!node) break;
                var cls = node.className || '';
                if (cls.indexOf('grid') !== -1 && node.children.length >= 3) {
                  applyBlockLayout(node);
                  break;
                }
              }
            }
          }

          /* 策略2：通过精确类名匹配（后备） */
          var grids = document.querySelectorAll('.grid');
          for (var j = 0; j < grids.length; j++) {
            var g = grids[j];
            var gc = g.className || '';
            if (gc.indexOf('grid-cols-2') !== -1 &&
                gc.indexOf('lg:grid-cols-5') !== -1) {
              applyBlockLayout(g);
            }
            if (gc.indexOf('grid-cols-3') !== -1 &&
                gc.indexOf('text-sm') !== -1 &&
                gc.indexOf('lg:') === -1) {
              applyBlockLayout(g);
            }
            /* 新增：确认/人员/班次/记录日期 的 grid-cols-4 与 grid-cols-2 md:grid-cols-4 */
            if (gc.indexOf('grid-cols-4') !== -1 &&
                gc.indexOf('lg:grid-cols-5') === -1) {
              applyBlockLayout(g);
            }
            if (gc.indexOf('grid-cols-2') !== -1 &&
                gc.indexOf('md:grid-cols-4') !== -1) {
              applyBlockLayout(g);
            }
          }
        }

        function applyBlockLayout(gridEl) {
          if (gridEl.getAttribute('data-single-col') === '1') {
            var k = gridEl.children;
            for (var c = 0; c < k.length; c++) {
              if (k[c].style.display !== 'block') {
                k[c].style.setProperty('display', 'block', 'important');
                k[c].style.setProperty('width', '100%', 'important');
              }
            }
            return;
          }
          gridEl.setAttribute('data-single-col', '1');
          gridEl.style.setProperty('display', 'block', 'important');
          gridEl.style.setProperty('grid-template-columns', 'none', 'important');
          gridEl.style.setProperty('gap', '0', 'important');
          var kids = gridEl.children;
          for (var k = 0; k < kids.length; k++) {
            kids[k].style.setProperty('display', 'block', 'important');
            kids[k].style.setProperty('width', '100%', 'important');
            kids[k].style.setProperty('padding', '6px 0', 'important');
            kids[k].style.setProperty('border-bottom',
              k < kids.length - 1 ? '1px solid #f1f5f9' : 'none', 'important');
          }
          var firstMono = kids[0] ? kids[0].querySelector('.font-mono') : null;
          if (firstMono) {
            firstMono.style.setProperty('font-size', '14px', 'important');
            firstMono.style.setProperty('line-height', '1.6', 'important');
            firstMono.style.setProperty('word-break', 'break-all', 'important');
          }
        }

        /* ===== 退出登录 =====
           产品信息卡页头的"登录后台 / 退出登录"按钮由 bundle 原生渲染（v44 起），
           点击退出时调用 window.__qrctsLogout。
           工序填写页 / 原材料录入页（页头含"返回追溯页"）没有原生退出按钮，
           这里在已登录时给这些页头注入一个"退出登录"按钮。 */
        window.__qrctsLogout = function() {
          try { localStorage.removeItem('qrcts_user_id'); } catch (e) {}
          window.location.href = '/login';
        };
        function injectLogout() {
          var loggedIn = false;
          try { loggedIn = !!localStorage.getItem('qrcts_user_id'); } catch (e) {}
          var headers = document.querySelectorAll('header.bg-primary-950');
          for (var h = 0; h < headers.length; h++) {
            var header = headers[h];
            // 只处理"返回追溯页"类页头（工序填写/原材料录入），产品信息卡页头由 bundle 负责
            if ((header.textContent || '').indexOf('返回追溯页') === -1) continue;
            var exist = header.querySelector('#qrcts-logout-header-btn');
            if (!loggedIn) {
              if (exist && exist.parentNode) exist.parentNode.removeChild(exist);
              continue;
            }
            if (exist) continue;
            var flex = header.querySelector('.max-w-4xl.mx-auto.flex.items-center.justify-between') ||
                       header.querySelector('.max-w-3xl.mx-auto.flex.items-center.justify-between') ||
                       header.querySelector('.flex.items-center.justify-between');
            if (!flex) continue;
            var hbtn = document.createElement('button');
            hbtn.id = 'qrcts-logout-header-btn';
            hbtn.type = 'button';
            hbtn.textContent = '退出登录';
            hbtn.addEventListener('click', window.__qrctsLogout);
            hbtn.style.cssText = 'background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;line-height:1.4;white-space:nowrap;';
            flex.appendChild(hbtn);
          }
        }

        /* ===== 路由变化处理 ===== */
        var origPushState = history.pushState;
        history.pushState = function() {
          origPushState.apply(this, arguments);
          var aside = document.querySelector('aside.w-60.sidebar-open');
          if (aside) toggleSidebar();
          setTimeout(forceSingleCol, 50);
          setTimeout(forceSingleCol, 200);
          setTimeout(forceSingleCol, 600);
          setTimeout(injectLogout, 50);
          setTimeout(injectLogout, 200);
          setTimeout(injectLogout, 600);
        };
        var origReplaceState = history.replaceState;
        history.replaceState = function() {
          origReplaceState.apply(this, arguments);
          setTimeout(forceSingleCol, 50);
          setTimeout(forceSingleCol, 200);
          setTimeout(injectLogout, 50);
          setTimeout(injectLogout, 200);
        };
        window.addEventListener('popstate', function() {
          setTimeout(forceSingleCol, 50);
          setTimeout(forceSingleCol, 200);
          setTimeout(injectLogout, 50);
          setTimeout(injectLogout, 200);
        });

        /* ===== MutationObserver ===== */
        var moTimer = null;
        var observer = new MutationObserver(function() {
          var aside = document.querySelector('aside.w-60');
          if (window.innerWidth <= 767) {
            btn.style.display = aside ? 'flex' : 'none';
          } else {
            btn.style.display = 'none';
          }
          if (!aside && btn.classList.contains('active')) {
            btn.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
          }
          if (moTimer) clearTimeout(moTimer);
          moTimer = setTimeout(forceSingleCol, 30);
          setTimeout(injectLogout, 30);
        });
        observer.observe(document.body, { childList: true, subtree: true });

        forceSingleCol();
        setTimeout(forceSingleCol, 100);
        setTimeout(forceSingleCol, 300);
        setTimeout(forceSingleCol, 800);
        setTimeout(forceSingleCol, 1500);
        setTimeout(forceSingleCol, 3000);
        injectLogout();
        setTimeout(injectLogout, 100);
        setTimeout(injectLogout, 300);
        setTimeout(injectLogout, 800);
        setTimeout(injectLogout, 1500);
        setTimeout(injectLogout, 3000);

        window.addEventListener('resize', function() {
          var aside = document.querySelector('aside.w-60');
          if (window.innerWidth <= 767) {
            btn.style.display = aside ? 'flex' : 'none';
          } else {
            btn.style.display = 'none';
          }
          forceSingleCol();
        });
      })();
    </script>
